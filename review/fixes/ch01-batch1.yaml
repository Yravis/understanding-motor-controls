tooling: >-
  (1) review:seed edits the YAML in place: unchanged entries are byte-identical (verified: a no-op seed leaves 0 diff lines);
  changed-hash entries go to pending with notes kept and the old verdict appended to `history`; new ids are appended.
  (2) tests/ledger.test.ts validates structure only (fields, known statuses, needs-fix has severity, no approval on an item
  with missing source text) plus seedLedger unit tests; no status expectations. (3) Sheets settle the cloned bucket and
  read lit lamps before any meter reading: idle now shows PL2 PL3 PLF. (4) Every sheet state runs simulated time (1 s);
  bolted X1 ground fault now shows F1 blown, rails 0 V, 'blown fuses: F1' (was a sustained 21.9 V).
