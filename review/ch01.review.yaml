    notes: "Verified against the photo: 250.21(A)(3) separately derived systems supplied by transformers with a primary voltage rating of 1000 V or less, if all of: a. used exclusively for control circuits; b. maintenance and supervision ensure only qualified persons service the installation; c. continuity of control power is required. The 3 correct options match. Optional wording improvement (not blocking): the distractor note 'does not set a control-voltage limit' could also say that 250.21 as a whole covers ac systems of 50 V to 1000 V (section heading in the photo); systems under 50 V fall under 250.20(A) (not in the photo, so I didn't check it). Book page/section alignment unverified (textbook not yet available), so approved-pending-book, not approved."
