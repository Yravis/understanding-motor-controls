    checkedAgainst:
      - "NEC2026 430.74 (user photo review/source-photos/nec2026-p70-400-430.72-430.75.jpg, p. 70-400; 430.74 not marked as revised)"
    basis: source
    notes: "Checked against the 430.74 photo. The core physics and the 430.74 rationale are correct (with X2 grounded and switching on X1, a ground fault downstream of a contact can't energize the load, and an X1-side ground fault opens the fuse instead of bypassing the stop). OVERREACH to fix: 'Never place a contact between a coil and X2' and the fieldNote 'treat that wiring as a defect'. As the builder's own note says, 430.74 is a performance requirement about ground faults in the control circuit remote from the controller; it doesn't prescribe the layout. In standard NEMA starter wiring (Chapter 2) the overload-relay contact is commonly wired between the M coil and X2 inside the controller, and a learner taught 'never' will call that a defect. SUGGESTED FIX: 'Keep stop, start and other switching devices on the X1 side, and connect the coil directly to X2. (The overload-relay contact inside a starter is a common exception you'll meet in Chapter 2.)' Change the fieldNote to: 'A coil whose switching contacts are on its X2 leg in field wiring can be energized, or have its stop bypassed, by a ground fault. Treat that as a defect.' Otherwise ready to approve (pending book) once the wording is fixed."
