  - id: ch01.u3.s3-10.device.led-pilot
    hash: 35b9f07d0c0c53e2f7e94b9ff884d387a0e6db7028de73912a05115c171f7a67
    status: pending
    severity: null
    checkedAgainst: []
    basis: general-knowledge
    notes: "MODEL ERROR (major): the engine treats an LED pilot that is off as a perfect open circuit (world.ts acBranches only adds the LED branch while ledOn). So on the default 10 Mohm VAC range, an open contact in series with an LED pilot reads 0.0 V 'floating' instead of about source voltage. Model output: idle CR1:1-CR1:2 (CR1 NO1 feeding PL1) = 0.0 (floating) and FS1:1-FS1:2 = 0.0 (floating); LoZ reads 24.0 V on the same points. The same points read 119.9 V with incandescent lamps (led:false), which is correct. A real 120 V LED pilot (series resistor/rectifier/driver) still conducts a little through a 10 Mohm meter, so the meter reads close to line voltage across the open contact. This contradicts what Day 3 teaches (ch01.u3.s3-1.card.voltage-across-contacts / question.voltage-across-open-contact) and the device-bench and relay-bench activities, and it shows up in every fault sheet (e.g. open-coil, high-resistance-contact and open-wire all show 'across CR1 NO contact 0.0 (floating)'). FIX: give the off-state LED a high but finite impedance (e.g. a few hundred kohm to a few Mohm, or the off-branch of a diode+resistor model) so a 10 Mohm meter reads near source voltage and LoZ (3 kohm) collapses it, then regenerate the sheets. Also fix these minor inconsistencies in this entry: (1) note says 'About 10 mA at 120 V' (120 V / 12 kohm = 10 mA) but the claim says 'only a few milliamps' and litI = 2 mA; make them agree (10 mA and up is typical of many 22 mm 120 V LED units; check a datasheet). (2) 'LED pilot lights are the default in new installations' overreaches; say 'are now the most common choice'. (3) 'read differently with the ohmmeter probes reversed' is stated as fact, but many 120 V LED units have bridge rectifiers or drivers and read OL both ways (the note itself says so). Hedge the claim to match: 'may read differently, or OL both ways, depending on the internal circuit'."
    reviewer: Eli
    date: 2026-11-26
    history:
      - hash: 8aed06ea6a1bb728d7ef973af0affb029083c3cec6e1b5fa2b951b0fcd49fd80
        status: needs-fix
        severity: major
        reviewer: Eli
        date: 2026-11-26
