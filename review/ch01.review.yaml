    notes: "Checked against the photo. Claim and body paraphrase 430.74 correctly: grounded conductor, ground fault remote from the controller must (1) not start the motor and (2) not bypass manually operated or automatic safety shutdown devices. Section number unchanged in 2026 (not marked revised), so 'older editions used the same number' is consistent. The bucket explanation also checks: a bolted X1-to-enclosure fault draws about 207 A and clears the 5 A model fuse in about 23 ms. ONLY ISSUE: fieldNote 'look for any contact between a coil and the grounded conductor. That's a 430.74 problem waiting to happen.' That will misfire in Chapter 2, where starter overload contacts sit between the coil and X2 inside the controller (not 'remote'). SUGGESTED FIX: 'When you inspect a control circuit, look for stop, start or safety contacts wired between a coil and the grounded conductor in the remote wiring. That's the arrangement 430.74 is written to prevent.' Approve (pending book) after this wording change."
