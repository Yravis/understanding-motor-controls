  - id: ch01.u3.s3-2.device.cr1
    hash: 527f30592f08523333b1a963c911c7d0ae28067853e8dd17fa0f6096873796df
    status: pending
    severity: null
    checkedAgainst: []
    basis: general-knowledge
    notes: "PARAMETER INCONSISTENCY (physics): inrush 70 VA at PF 0.6 on 120 V gives |Z| = 14400/70 = 205.7 ohm and R = 205.7 x 0.6 = 123 ohm. That is smaller than dcR = 350 ohm, which is impossible: the AC resistance of a coil can't be below its DC winding resistance. Check by power: I_inrush = 70/120 = 0.583 A, and copper loss alone I2 x Rdc = 0.34 x 350 = 119 W, more than the 42 W real power and even the 70 VA apparent power. With Rdc = 350 ohm the most a 120 V coil can draw is 120/350 = 0.343 A (41 VA). Sealed is fine (|Z| = 1440 ohm, R = 432 ohm >= 350). FIX: set dcR to 120 ohm or less (e.g. 90-100 ohm; then I2R = 0.34 x 100 = 34 W <= 42 W), or reduce inrushVA to about 24 VA (14400 x 0.6 / 350 = 24.7 VA). The sheet's 'CR1 coil resistance 350.0 ohm' reading changes with it. Nothing is graded on it, but learners do see the number. Typical values, so it stays unapproved after the fix too."
    reviewer: Eli
    date: 2026-11-26
    history:
      - hash: 424676c94dc00e1db71691a1f1a597f8719398f8bf3cce98be0383acc5058f6a
