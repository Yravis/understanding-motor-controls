    notes: "Verified against the photo. NEC 2026 430.74: 'Where one conductor of the motor control circuit is grounded, the motor control circuit shall be arranged so that a ground fault in the control circuit remote from the motor controller will (1) not start the motor and (2) not bypass manually operated shutdown devices or automatic safety shutdown devices.' The correct answer matches. Distractors: 430.74 says nothing about overload trip timing or GFCI (correct); ground detectors are 250.21(B) for ungrounded systems (confirmed on p. 70-139). Book page/section alignment unverified (textbook not yet available), so approved-pending-book, not approved."
