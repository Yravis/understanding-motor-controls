    basis: source
    notes: "Verified: 1910.147(d) says the procedure 'shall be done in the following sequence': (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation. The six steps match that order exactly. The last step's label names live-dead-live (a 70E method whose text I have not opened), but the graded thing here is the order, which OSHA fully supports. Suggestion (not an error): 1910.333(b)(2)(iv)(A) also requires a qualified person to operate the equipment controls or otherwise verify the equipment cannot be restarted (the 'try' step). Consider adding it to the verification step of the example sequence in a later revision. Book page/section alignment unverified (textbook not yet available), so approved-pending-book, not approved."
