    basis: general-knowledge
    notes: "OVERREACH / internal contradiction: 'it carries only the small control current needed to operate a coil, not the load current'. In this same bucket PB2 feeds PL3 directly and FS1/PS1/TS1/FLS1 feed lamps directly, so the pilot device carries the full current of that load. Pilot-duty float and pressure switches also commonly switch small loads directly (two-wire control). Day 1's card (ch01.u1.s1-1.card.pilot-devices-and-loads) correctly says 'pilot devices sit in the path and the load ends the path'. SUGGESTED FIX: 'The pilot device is a messenger: it carries only control-circuit current, such as a coil or a pilot lamp, never the motor's power-circuit current.' Same overreach in the claim of ch01.u2.s2-1.question.pilot-device-meaning (its answers are fine)."
