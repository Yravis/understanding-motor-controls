  - id: ch01.u3.s3-18.fault.contact-on-x2-side
    hash: e6944a06112f34550a64f78faea3c1a4f70c41505e6a7a7c923790e99a636f55
    status: pending
    severity: null
    checkedAgainst:
      - "NEC2026 430.74 (user photo review/source-photos/nec2026-p70-400-430.72-430.75.jpg, p. 70-400; 430.74 not marked as revised)"
    basis: source
    notes: "Physics is right: with CR1 NO1 moved to the X2 side of PL1, the PL1 terminals and the contact's line side sit at X1 potential while the contact is open, and behavior is unchanged (behaviorSame true). CITATION ISSUE: this item cites NEC 430.74 as the reason it's a defect, but 430.74 is about a ground fault starting the motor or bypassing shutdown devices. Here the load is an indicating lamp, so a ground fault between PL1 and the contact would only light PL1 falsely. That's a wiring-practice and false-indication problem, not a 430.74 violation as written. SUGGESTED FIX: either (a) keep the lamp fault but describe it as breaking the shop's contacts-on-X1 practice (false 'CR1 PICKED UP' indication on a ground fault) and drop or soften the 430.74 cite, or (b) put the miswire on a coil rung (for example a timer coil or CR1 coil with its switching on the X2 leg) so it really is a 430.74 hazard. Also: the KEY_POINTS table in the sheet shows no differences for this fault, so add a probe (PL1:1 to G: 0 V healthy vs 120 V faulted) so the reviewer can see the expected finding."
    reviewer: Eli
    date: 2026-11-26
