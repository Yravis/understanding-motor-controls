  - id: ch01.u3.s3-18.question.why-contacts-x1
    hash: 0ee6aba1df8cd3d3743b12ad8716dde6e75f9e84d245e523131327a512a42be9
    status: approved-pending-book
    severity: null
    checkedAgainst:
      - "NEC2026 430.74 (user photo review/source-photos/nec2026-p70-400-430.72-430.75.jpg, p. 70-400; 430.74 not marked as revised)"
    basis: source
    notes: "Verified the rule against the 430.74 photo text and checked the physics by hand. Bucket X2 is bonded (bondR 0.01 ohm). A ground on the wire between a closed-on-X1 contact and the coil holds that wire near X2 potential, so the coil sees about 0 V. When the contact closes it's a short from X1 to ground: I is about 120 V / |0.46 + j0.35| ohm, roughly 207 A, so with I2t = 1000 A2s the fuse clears in about 23 ms. The coil is not energized. With the contact on the X2 leg instead (coil fed from X1), a ground between coil and contact completes the coil circuit through the bond: the coil energizes and the contact is bypassed, which is what 430.74(1)/(2) prohibit. Answer and explanation are correct; one defensible answer. Book page/section alignment unverified (textbook not yet available), so approved-pending-book, not approved."
    reviewer: Eli
    date: 2026-11-26
