    basis: general-knowledge
    notes: "Reviewed 2026-11-26 from general knowledge only; no source opened for this review covers the claim (textbook not yet available; no NEMA/IEEE/manufacturer text). No technical error found. Stays unapproved (blocked-on-source) until an opened source or the book supports it. Physics hand-checked: R about 0.35 (source) + 0.02 (fuse) + 0.05 (fault) + 0.01 (bond) + wires, about 0.46 ohm, and X = 0.35 ohm, so |Z| is about 0.58 ohm and I about 207 A; I2t 1000 A2s gives about 23 ms to clear. Fix actions (repair conductor, then same-rating fuse) are right. 430.74 photo opened and consistent, but the claim rests on illustrative device values, so it stays unapproved. TOOLING: the sheet's idle rows show a sustained 210 A fault (source 21.9 V, 4.2 V across F1, 2.1 V X2-to-G) because readingsFor() doesn't run the fault's 'sequence' (advance 1 s). The fuse should already be open, as the symptom says. Regenerate with the sequence applied."
