  - id: ch01.u3.s3-16.card.solid-state-timer
    hash: 7043374871078de81bf58f01ea958ad8f2e8838974811283ebcad5d66ce12e9d
    status: pending
    severity: null
    checkedAgainst: []
    basis: general-knowledge
    notes: "OVERGENERALIZATION: 'An off-delay solid-state timer ... needs constant supply power ... plus a separate trigger input' and 'If the constant supply is lost, the output drops at once'. That's true of the common trigger (control-signal) type modeled as TD4, but 'true off-delay' solid-state timers also exist. They need no separate trigger or constant supply: they time out after their input power is removed, using stored internal energy. SUGGESTED FIX: 'The common solid-state off-delay timer (the trigger or control-signal type, like TD4) needs...'. Add one sentence: 'Some models, sold as true off-delay timers, time out after power is removed with no separate trigger; check the wiring diagram on the timer.' ch01.u3.s3-16.question.ss-offdelay-supply-loss is fine because its stem fixes the type (output transferred by a trigger, constant supply)."
    reviewer: Eli
    date: 2026-11-26
