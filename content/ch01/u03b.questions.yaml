    claim: "Releasing PB1 before the preset resets the on-delay timers, so neither on-delay lamp ever lights."
    body: {"format": "predict-state", "day": 8, "stem": "TR1 (pneumatic on-delay) is set to 5 s and TD3 (solid-state on-delay) is set to 3 s. PB1 is held for only 2 s, released, and 6 s pass. Which statement is true?", "answers": [{"text": "PL8 and PL10 are both out because both timers reset", "correct": true}, {"text": "PL8 and PL10 are both lit because both timers kept running", "distractorWhy": "A timer does not continue timing once its coil or supply drops."}, {"text": "PL10 is lit because 3 s is shorter than 6 s", "distractorWhy": "The coil dropped at 2 s, before TD3's 3 s preset."}, {"text": "PL8 is lit and PL10 is out because TR1 is pneumatic", "distractorWhy": "Pneumatic timers reset the same way when the coil drops early."}], "scene": {"actions": [{"do": "press", "dev": "PB1"}, {"do": "advance", "arg": 2}, {"do": "release", "dev": "PB1"}, {"do": "advance", "arg": 6}], "expect": {"lit": {"PL8": false, "PL10": false}}}, "explanation": "At release, both on-delay timers had not reached their preset. Each resets to zero and its contacts never close. So PL8 and PL10 never light during the sequence, and are out at the end."}
  - <<: *d
    id: ch01.u3.s3-18.question.loads-on-x2
    book: { chapter: 1, unit: 3, section: "3.18", page: 37, pageStatus: toc-unverified, figure: null }
    claim: "On a ladder schematic switching devices sit on the left/X1 side of a rung and loads connect directly to the X2 side."
    body: {"format": "mcq", "day": 9, "stem": "On a control schematic with X1 on the left rail and X2 on the right rail, where do a pushbutton and a coil go on the same rung?", "answers": [{"text": "The pushbutton on the X1 side and the coil directly on X2", "correct": true}, {"text": "The coil on the X1 side and the pushbutton directly on X2", "distractorWhy": "A contact on the X2 leg would let a ground fault energize the coil."}, {"text": "Both on the X2 side, one after the other", "distractorWhy": "Switching devices belong between the X1 rail and the load."}, {"text": "Either order, since a series circuit has no preferred side", "distractorWhy": "In a grounded control circuit the order matters; the load connects directly to X2."}], "explanation": "Contacts and other switching devices go on the X1 side and the coil connects directly to X2. Power reaches the coil only through the closed contacts."}
  - <<: *d
    id: ch01.u3.s3-18.question.why-contacts-x1
    book: { chapter: 1, unit: 3, section: "3.18", page: 37, pageStatus: toc-unverified, figure: null }
    claim: "With contacts on X1 and coils on X2, a ground fault downstream of a contact cannot energize the load."
    nec: [{ edition: 2026, ref: "430.74", kind: rule, editionCheck: "confirmed in NEC 2026 photo (p. 70-400)" }]
    excerpts: [{ ref: "NEC 2026 430.74", covers: ["nec2026:430.74"], photo: "review/source-photos/nec2026-p70-400-430.72-430.75.jpg", summary: "430.74 Electrical Arrangement of Control Circuits: where one conductor of the motor control circuit is grounded, the circuit is arranged so a ground fault in the control circuit remote from the motor controller will (1) not start the motor and (2) not bypass manually operated shutdown devices or automatic safety shutdown devices." }]
