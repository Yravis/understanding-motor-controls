  - <<: *d
    id: ch01.u3.s3-10.question.mushroom-stop-symbol
    book: { chapter: 1, unit: 3, section: "3.10", page: 29, pageStatus: toc-unverified, figure: null }
    claim: "The symbol shown is a normally closed mushroom-head pushbutton, typically used as a stop device; the head shape alone does not say whether it is maintained."
    body: {"format": "identify-symbol", "day": 7, "stem": "Which description matches the pushbutton symbol shown?", "answers": [{"text": "A normally closed mushroom-head button, used as a stop device", "correct": true}, {"text": "A normally open flush button, used as a start device", "distractorWhy": "A start button is NO, and the symbol shown is a stop style with a mushroom head."}, {"text": "A normally open mushroom button that closes when pressed", "distractorWhy": "The contacts of a stop device are closed in the shelf state, so NO is wrong."}, {"text": "A normally closed pilot light that glows when stopped", "distractorWhy": "A pilot light is a lamp symbol, not a pushbutton contact block."}], "symbol": "pb-nc-mushroom", "explanation": "The shown device is a mushroom-head NC pushbutton. Its contacts are closed in the shelf state and open when it is pressed, and a maintained head latches. That is why it suits a stop function."}
  - <<: *d
    id: ch01.u3.s3-10.question.momentary-vs-maintained
    book: { chapter: 1, unit: 3, section: "3.10", page: 29, pageStatus: toc-unverified, figure: null }
    claim: "A momentary pushbutton returns to its normal state when released, while a maintained one stays operated until acted on again."
    body: {"format": "mcq", "day": 7, "stem": "What separates a maintained pushbutton from a momentary one?", "answers": [{"text": "It stays in the operated position until it is reset", "correct": true}, {"text": "It has more contact blocks than a momentary button", "distractorWhy": "The number of contact blocks does not decide whether a button latches."}, {"text": "It only works on a supply that is higher than a control voltage", "distractorWhy": "Operating style has nothing to do with voltage."}, {"text": "Its contacts are normally closed instead of normally open", "distractorWhy": "NO and NC describe the contact state, not whether the head latches."}], "explanation": "Momentary buttons spring back, so their contacts are only changed while the operator holds the button. Maintained buttons latch in the operated position until reset, which suits stop and emergency devices."}
  - <<: *d
    id: ch01.u3.s3-10.question.why-mushroom-estop
    book: { chapter: 1, unit: 3, section: "3.10", page: 29, pageStatus: toc-unverified, figure: null }
    claim: "A large mushroom head is a common stop-button choice because it is easy to strike quickly."
    body: {"format": "mcq", "day": 7, "stem": "Why is the large mushroom head a common choice for stop and emergency-stop buttons?", "answers": [{"text": "It is easy to hit quickly with a palm or glove", "correct": true}, {"text": "It makes the contact block carry more current", "distractorWhy": "The head shape does not change the contact rating."}, {"text": "It prevents the button from being pressed by accident, like a flush head", "distractorWhy": "The flush head is the accident-resistant style; the mushroom head is the easy-to-hit style."}, {"text": "It lets the button work on a dead circuit", "distractorWhy": "A pilot device needs a circuit to operate; head shape does not change that."}], "explanation": "A stop device must be reachable fast, even in a hurry or with a gloved or full hand. The big head is easy to strike and is hard to miss, while small flush heads are intended to avoid accidental operation."}
  - <<: *d
    id: ch01.u3.s3-10.question.nc-button-unpressed
    book: { chapter: 1, unit: 3, section: "3.10", page: 29, pageStatus: toc-unverified, figure: null }
    claim: "A normally closed pushbutton passes current when it is not pressed and opens when it is pressed."
    body: {"format": "mcq", "day": 7, "stem": "A normally closed pushbutton sits alone in series with a lamp on an energized circuit. What does the lamp do?", "answers": [{"text": "It is on while the button is untouched and goes out when pressed", "correct": true}, {"text": "It is off until the button is pressed, then comes on", "distractorWhy": "That describes a normally open button."}, {"text": "It stays off because there is no seal-in contact", "distractorWhy": "A seal-in is only needed to hold a coil on; a lamp in series just follows the button."}, {"text": "It flickers because a momentary button chatters", "distractorWhy": "Chatter is not a normal behavior of a good pushbutton."}], "explanation": "Normal means unpressed, the shelf state. A normally closed button conducts while unpressed, so the lamp is on. Pressing it opens the path and the lamp goes out, as with PB2 and PL3 in the bucket."}
  - <<: *d
    id: ch01.u3.s3-11.question.solenoid-jammed-plunger
    book: { chapter: 1, unit: 3, section: "3.11", page: 31, pageStatus: toc-unverified, figure: null }
    claim: "An AC solenoid draws more current while its plunger is out, so a plunger that jams open can overheat the coil."
    body: {"format": "mcq", "day": 7, "stem": "An AC solenoid is energized but its plunger is jammed open and never seats. What is the likely consequence?", "answers": [{"text": "The coil keeps drawing the higher current and can overheat", "correct": true}, {"text": "The coil current falls to zero because the plunger is out", "distractorWhy": "The plunger being out raises current, not lowers it."}, {"text": "The coil switches itself off with its own contacts", "distractorWhy": "A plain solenoid has no internal contacts that turn it off."}, {"text": "The control supply voltage rises to compensate", "distractorWhy": "A load does not raise the supply voltage; heavy current actually pulls it down."}], "explanation": "An AC coil draws a large inrush current while the magnetic gap is open and only settles to a lower current once the plunger seats. A jammed plunger keeps the current high, which heats the winding and can burn it out."}
  - <<: *d
    id: ch01.u3.s3-11.question.tap-solenoid-coil
    book: { chapter: 1, unit: 3, section: "3.11", page: 31, pageStatus: toc-unverified, figure: null }
    claim: "The solenoid coil SOL1 is the load that moves the valve plunger in the bucket schematic."
    body: {"format": "tap-schematic", "day": 7, "stem": "Tap the part of the schematic that is the electromagnet that moves the valve plunger.", "tapTargets": ["SOL1.coil"], "tapWhy": "SOL1.coil is the coil load that pulls in the plunger.", "explanation": "The solenoid is a coil load. It is on the X2 side of its rung, with the limit switch contact on the X1 side. The lamps are loads that only indicate."}
  - <<: *d
    id: ch01.u3.s3-12.question.nohc-meaning
    book: { chapter: 1, unit: 3, section: "3.12", page: 31, pageStatus: toc-unverified, figure: null }
    claim: "NOHC means a contact that is normally open on the shelf but held closed in the installation."
    body: {"format": "mcq", "day": 7, "stem": "A limit switch is rated normally open, held closed (NOHC). What does that tell you?", "answers": [{"text": "It is open on the shelf but closed while the machine presses it", "correct": true}, {"text": "It is closed on the shelf and held open by the machine", "distractorWhy": "That is the opposite pairing, NCHO."}, {"text": "It is open in both states and never conducts", "distractorWhy": "Then it would be useless as a switch; the held condition closes it."}, {"text": "It closes only after a time delay", "distractorWhy": "Delays are for timing relays, not for held-state naming."}], "explanation": "Normal describes the shelf state, so the contact is open when nothing acts on it. In the installation the machine presses the actuator, so the circuit sees the contact closed until the machine moves away."}
  - <<: *d
    id: ch01.u3.s3-13.question.temp-switch-installed
    book: { chapter: 1, unit: 3, section: "3.13", page: 34, pageStatus: toc-unverified, figure: null }
    claim: "A temperature switch's normal state is its shelf state, so an installed switch in a hot process may already be actuated."
    body: {"format": "mcq", "day": 7, "stem": "A temperature switch is sold as normally open. It is installed on a vessel that is already well above its setpoint. What do you expect the circuit to see?", "answers": [{"text": "Closed contacts, because the process has actuated the switch", "correct": true}, {"text": "Open contacts, because the switch is labeled normally open", "distractorWhy": "The label gives the shelf state, not the installed state."}, {"text": "An open circuit until the supply is turned off", "distractorWhy": "Supply on or off does not set the contact state of a temperature switch."}, {"text": "Either state at random, because the label is meaningless", "distractorWhy": "The label is meaningful as the shelf state; the process then determines the installed state."}], "explanation": "Normal means the shelf state. The sensed temperature, not the label, decides the installed state. A NO temperature switch at a high temperature is actuated, so the circuit sees closed contacts."}
  - <<: *d
    id: ch01.u3.s3-12.question.held-state-statements
    book: { chapter: 1, unit: 3, section: "3.12", page: 31, pageStatus: toc-unverified, figure: null }
    claim: "NOHC and NCHO describe a shelf state plus a held state in the installation."
    body: {"format": "multi-select", "day": 7, "stem": "Select the statements that are true about held-state naming of a switch.", "answers": [{"text": "NCHO is closed on the shelf", "correct": true}, {"text": "NOHC is open on the shelf", "correct": true}, {"text": "NCHO is open on the shelf", "distractorWhy": "NC stands for normally closed, so the shelf state is closed."}, {"text": "NOHC is held open by the machine", "distractorWhy": "NOHC is held closed; held open belongs to NCHO."}, {"text": "Held state always matches the shelf state", "distractorWhy": "The held state is by definition the opposite of the shelf state."}], "explanation": "The first word group is the shelf state, and the held part is what the installation does to the actuator. NOHC is open on the shelf and closed in the installation. NCHO is closed on the shelf and open in the installation."}
  - <<: *d
    id: ch01.u3.s3-12.question.limit-switch-solenoid-scene
    book: { chapter: 1, unit: 3, section: "3.12", page: 31, pageStatus: toc-unverified, figure: null }
    claim: "With LS1 normally closed in series with the SOL1 coil, actuating LS1 de-energizes the solenoid."
    body: {"format": "predict-state", "day": 7, "stem": "In the bucket, the NC limit switch LS1 feeds the SOL1 solenoid coil. Currently the coil is energized. The machine now actuates LS1. What happens to SOL1?", "answers": [{"text": "The coil de-energizes because the NC contact opens", "correct": true}, {"text": "The coil stays energized because the NC contact is held closed", "distractorWhy": "An NC contact opens when actuated, not closes."}, {"text": "The coil energizes harder because the contact is pressed", "distractorWhy": "A pressed NC contact opens; coil current stops."}, {"text": "The coil is unchanged because limit switches only drive lamps", "distractorWhy": "A limit switch controls whatever load sits on its rung, here SOL1."}], "scene": {"actions": [{"do": "toggle", "dev": "LS1"}], "expect": {"coil": {"SOL1.coil": false}}}, "explanation": "An NC contact opens when actuated. That breaks the rung between X1 and the coil, so SOL1 de-energizes."}
  - <<: *d
    id: ch01.u3.s3-17.question.nctc-vs-ncto
    book: { chapter: 1, unit: 3, section: "3.17", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "An NCTO contact belongs to an on-delay timer: normally closed, timed open after energize."
    body: {"format": "mcq", "day": 8, "stem": "A timing relay has a normally closed contact marked NCTO. What does the contact do when the coil is energized?", "answers": [{"text": "It stays closed during the delay and then opens", "correct": true}, {"text": "It opens immediately and recloses after the delay", "distractorWhy": "That is an NCTC behavior of an off-delay timer."}, {"text": "It closes after the delay, since it follows the coil", "distractorWhy": "The contact starts closed; it is the NO contact that closes after a delay."}, {"text": "It never changes unless the coil is removed", "distractorWhy": "A timed contact changes on its own once the preset elapses."}], "explanation": "NCTO is normally closed, timed open. On an on-delay timer the contact stays closed during the delay and opens when the delay finishes. On de-energize it recloses at once."}
  - <<: *d
    id: ch01.u3.s3-17.question.timer-symbol-off-delay
    book: { chapter: 1, unit: 3, section: "3.17", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "The symbol shown is an off-delay timed contact, normally open, timed open (NOTO)."
    body: {"format": "identify-symbol", "day": 8, "stem": "Which description matches the timed-contact symbol shown?", "answers": [{"text": "Off-delay, normally open: closes at once, opens after a delay", "correct": true}, {"text": "On-delay, normally open: closes after a delay when energized", "distractorWhy": "That is NOTC, the on-delay NO contact."}, {"text": "Instantaneous contact that follows the coil with no delay", "distractorWhy": "An instantaneous contact would carry no timing marking at all."}, {"text": "On-delay, normally closed: opens after a delay when energized", "distractorWhy": "That is NCTO, the on-delay NC contact."}], "symbol": "timer-off-noto", "explanation": "The shown contact is a NOTO. It closes as soon as the coil energizes and opens only after the delay that begins when the coil de-energizes."}
  - <<: *d
    id: ch01.u3.s3-17.question.delay-starts-when
    book: { chapter: 1, unit: 3, section: "3.17", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "On-delay timing starts when the coil energizes; off-delay timing starts when it de-energizes."
    body: {"format": "mcq", "day": 8, "stem": "When does the delay begin on an on-delay timer compared with an off-delay timer?", "answers": [{"text": "On-delay starts at energize; off-delay starts at de-energize", "correct": true}, {"text": "Both start when the coil energizes", "distractorWhy": "Only the on-delay begins timing at energize."}, {"text": "On-delay starts at de-energize; off-delay starts at energize", "distractorWhy": "That swaps the two types."}, {"text": "Both start when the supply is removed", "distractorWhy": "Only the off-delay times after the coil is de-energized."}], "explanation": "The name tells you when the delay applies. On-delay times after energize. Off-delay transfers at energize and times after de-energize."}
  - <<: *d
    id: ch01.u3.s3-14.question.pneumatic-method
    book: { chapter: 1, unit: 3, section: "3.14", page: 35, pageStatus: toc-unverified, figure: null }
    claim: "A pneumatic timing relay delays by metering air through an adjustable opening."
    body: {"format": "mcq", "day": 8, "stem": "How does a typical pneumatic timing relay produce its delay?", "answers": [{"text": "It restricts air flow through an adjustable opening", "correct": true}, {"text": "It counts oscillator pulses on an internal circuit board", "distractorWhy": "That describes a solid-state timer."}, {"text": "It heats a bimetal strip with the coil current", "distractorWhy": "That is a thermal timing method, not a pneumatic one."}, {"text": "It slows the supply voltage with a series resistor", "distractorWhy": "A pneumatic timer uses air, not an electrical resistor, for timing."}], "explanation": "Air is metered through an adjustable opening, so the mechanism takes time to move before the timed contacts change. The adjustment sets the delay. This is also why repeatability is looser than for electronic timers."}
  - <<: *d
    id: ch01.u3.s3-15.question.instantaneous-follow
    book: { chapter: 1, unit: 3, section: "3.15", page: 35, pageStatus: toc-unverified, figure: null }
    claim: "Instantaneous contacts on a timing relay follow the coil with no delay."
    body: {"format": "mcq", "day": 8, "stem": "A timing relay has one timed contact set and one instantaneous contact set. The coil is energized. What do the instantaneous contacts do?", "answers": [{"text": "They change state at once and return when the coil drops", "correct": true}, {"text": "They wait for the preset and then change", "distractorWhy": "That is what the timed set does."}, {"text": "They change only after the coil is de-energized", "distractorWhy": "They follow the coil directly, not after it."}, {"text": "They stay unchanged on a pneumatic timer", "distractorWhy": "Pneumatic timers have instantaneous sets that follow the coil too."}], "explanation": "Instantaneous contacts change state as soon as the coil energizes and return as soon as it drops, regardless of the preset. Only the timed set waits."}
  - <<: *d
    id: ch01.u3.s3-16.question.ss-offdelay-supply-loss
    book: { chapter: 1, unit: 3, section: "3.16", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "A solid-state off-delay timer drops its output immediately if its constant supply is lost."
    body: {"format": "mcq", "day": 8, "stem": "A solid-state off-delay timer has its output transferred by an active trigger. The constant supply is then lost. What does the output do?", "answers": [{"text": "It drops immediately because no supply is available to time", "correct": true}, {"text": "It holds until the preset elapses, then drops", "distractorWhy": "That needs supply to run the timing."}, {"text": "It stays transferred until the trigger is also removed", "distractorWhy": "Supply loss overrides the trigger state."}, {"text": "It transfers the other way after the preset", "distractorWhy": "Without supply the timer simply loses its output."}], "explanation": "The timer's electronics need constant supply to time. With the supply gone, nothing can run the delay, so the output drops at once instead of timing out."}
  - <<: *d
    id: ch01.u3.s3-17.question.ondelay-multi
    book: { chapter: 1, unit: 3, section: "3.17", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "An on-delay timer times from energize, resets if the coil drops early, and returns contacts at once on de-energize."
    body: {"format": "multi-select", "day": 8, "stem": "Select the true statements about an on-delay timing relay.", "answers": [{"text": "Its timing starts when the coil energizes", "correct": true}, {"text": "Dropping the coil before the delay finishes resets it", "correct": true}, {"text": "Its NO timed contact closes immediately on energize", "distractorWhy": "That behavior belongs to an off-delay NOTO contact."}, {"text": "Its contacts wait out the delay again after de-energize", "distractorWhy": "On de-energize the contacts return at once; only an off-delay waits."}, {"text": "It needs a separate constant supply and trigger", "distractorWhy": "That is for solid-state off-delay timers, not a coil-driven on-delay."}], "explanation": "On-delay timing starts when the coil energizes. If the coil drops before the delay is complete, the timer resets and the timed contacts never change. When the coil is de-energized after timing out, the contacts return immediately."}
  - <<: *d
    id: ch01.u3.s3-17.question.offdelay-order
    book: { chapter: 1, unit: 3, section: "3.17", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "An off-delay timer transfers on energize, times after de-energize, and returns after the preset."
    body: {"format": "order-steps", "day": 8, "stem": "Put the sequence for an off-delay timer's NO contact in the correct order.", "steps": ["The coil is energized and the NO timed contact closes immediately", "The coil is de-energized and the delay timing begins", "The delay runs while the contact stays closed", "The preset is reached and the contact reopens"], "explanation": "Off-delay contacts transfer immediately when the coil energizes. Timing begins only when the coil de-energizes, and the contacts return when the preset has elapsed."}
  - <<: *d
    id: ch01.u3.s3-17.question.offdelay-reenergize
    book: { chapter: 1, unit: 3, section: "3.17", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "Re-energizing an off-delay timer while it is timing resets the delay and holds the contacts transferred."
    body: {"format": "mcq", "day": 8, "stem": "An off-delay timer's coil is de-energized and timing has begun. Before the preset finishes the coil is energized again. What happens?", "answers": [{"text": "The timer resets and the contacts stay transferred", "correct": true}, {"text": "The contacts open right away because timing was interrupted", "distractorWhy": "They stay in the energized state; re-energize does not open them."}, {"text": "The delay continues and the contacts open at the original time", "distractorWhy": "Re-energizing resets timing instead of continuing it."}, {"text": "The timer locks up until the supply is removed", "distractorWhy": "No lockup occurs; it resets normally."}], "explanation": "Re-energizing during timing resets the timer. The contacts remain in the energized state, and the delay starts fresh the next time the coil drops."}
  - <<: *d
    id: ch01.u3.s3-17.question.scene-release-onoff
    book: { chapter: 1, unit: 3, section: "3.17", page: 36, pageStatus: toc-unverified, figure: null }
    claim: "One second after releasing PB1, the on-delay lamp PL8 is out while the off-delay lamp PL9 is still on."
    body: {"format": "predict-state", "day": 8, "stem": "In the bucket, TR1 is an on-delay and TR2 is an off-delay, both set to 5 s. PB1 is held for 6 s and then released. One second later, which statement is true?", "answers": [{"text": "PL8 is out and PL9 is still lit", "correct": true}, {"text": "Both PL8 and PL9 are still lit", "distractorWhy": "The on-delay contact returns immediately when the coil drops."}, {"text": "Both PL8 and PL9 are out", "distractorWhy": "The off-delay contact stays transferred until its delay has elapsed."}, {"text": "PL8 is lit and PL9 is out", "distractorWhy": "This reverses the on-delay and off-delay behavior."}], "scene": {"actions": [{"do": "press", "dev": "PB1"}, {"do": "advance", "arg": 6}, {"do": "release", "dev": "PB1"}, {"do": "advance", "arg": 1}], "expect": {"lit": {"PL8": false, "PL9": true}}}, "explanation": "Releasing PB1 drops CR1, which de-energizes both timer coils. TR1 is an on-delay, so its contact returns at once and PL8 goes out. TR2 is an off-delay, and its delay has just started, so its contact is still closed and PL9 is still on."}
  - <<: *d
