    body: {"format": "predict-state", "day": 8, "stem": "TR2 (pneumatic off-delay) is set to 5 s and TD4 (solid-state off-delay, constant supply) is set to 3 s. PB1 is held for 6 s, then released and 4 s pass. Which lamps are lit?", "answers": [{"text": "PL9 is lit and PL11 is out", "correct": true}, {"text": "Both PL9 and PL11 are lit", "distractorWhy": "TD4's shorter preset has already elapsed."}, {"text": "Both PL9 and PL11 are out", "distractorWhy": "TR2's preset is longer than the time elapsed."}, {"text": "PL11 is lit and PL9 is out", "distractorWhy": "This reverses which timer has the longer preset."}], "scene": {"actions": [{"do": "press", "dev": "PB1"}, {"do": "advance", "arg": 6}, {"do": "release", "dev": "PB1"}, {"do": "advance", "arg": 4}], "expect": {"lit": {"PL9": true, "PL11": false}}}, "explanation": "Both timers are off-delay and begin timing at release. After 4 s, TD4 has passed its 3 s preset and PL11 is out. TR2 still has 1 s remaining, so PL9 is lit."}
  - <<: *d
    id: ch01.u3.s3-17.question.scene-ondelay-interrupted
