  - id: ch01.u3.s3-18.fault.contact-on-x2-side
    type: fault
    version: 1
    book:
      chapter: 1
      unit: 3
      section: "3.18"
      page: 37
      pageStatus: toc-unverified
      figure: null
    nec:
      - edition: 2026
        ref: "430.74"
        kind: rule
        editionCheck: confirmed in NEC 2026 photo (p. 70-400)
    nema: []
    ieee: []
    excerpts:
      - ref: NEC 2026 430.74
        covers:
          - nec2026:430.74
        photo: review/source-photos/nec2026-p70-400-430.72-430.75.jpg
        summary: "430.74 Electrical Arrangement of Control Circuits: with one control conductor grounded, a ground fault in the remote control circuit must not start the motor or bypass manual or automatic safety shutdown devices."
    basis: illustrative
    enforcedNote: null
    other:
      - src: datasheet:TBD
    bookAlignment: provisional
    claim: START pushbutton PB1 was wired between the CR1 coil and X2 instead of between the E-stop and the coil. The circuit still works, but while START is released with the E-stop reset, both CR1 coil terminals sit at X1 potential, so a ground fault on the field wire between CR1 and PB1 would energize CR1 without pressing START (the arrangement NEC 2026 430.74 prohibits in a motor control circuit).
    reviewerNotes: Expected readings are generated by the model (see review sheets); device values are typical/illustrative. Check that the symptom matches what the model shows and that the fix restores behavior.
    body:
      engineId: contact-on-x2-side
      title: START pushbutton wired on the X2 side of CR1
      cause: START pushbutton PB1 was wired between the CR1 coil and X2 instead of between the E-stop and the coil. The circuit still works, but while START is released with the E-stop reset, both CR1 coil terminals sit at X1 potential, so a ground fault on the field wire between CR1 and PB1 would energize CR1 without pressing START (the arrangement NEC 2026 430.74 prohibits in a motor control circuit).
      symptom: 'Operator: "Everything works." (Behavior is unchanged: a hazard found by measurement. While START is released with the E-stop reset, both CR1 coil terminals read 120 V to ground instead of 0 V.)'
      fixActions:
        - kind: reland
          target: W:PB1:1
          note: Land PB1 on the X1 side (wire 3, after the E-stop).
        - kind: reland
          target: W:PB1:2
          note: Land the PB1 output on wire 4.
        - kind: reland
          target: W:CR1:C1
          note: Land the CR1 coil feed on wire 4.
        - kind: reland
          target: W:CR1:C2
          note: Land CR1 directly on X2 (wire 2).
      rootCause: W:PB1:2
      behaviorSame: true
      minMeasurements: 1
      day: 9
