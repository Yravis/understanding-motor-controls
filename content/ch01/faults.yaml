  - id: ch01.u3.s3-18.fault.contact-on-x2-side
    type: fault
    version: 1
    book:
      chapter: 1
      unit: 3
      section: "3.18"
      page: 37
      pageStatus: toc-unverified
      figure: null
    nec:
      - edition: 2026
        ref: "430.74"
        kind: rule
        editionCheck: confirmed in NEC 2026 photo (p. 70-400)
    nema: []
    ieee: []
    excerpts:
      - ref: NEC 2026 430.74
        covers:
          - nec2026:430.74
        photo: review/source-photos/nec2026-p70-400-430.72-430.75.jpg
        summary: "430.74 Electrical Arrangement of Control Circuits: with one control conductor grounded, a ground fault in the remote control circuit must not start the motor or bypass manual or automatic safety shutdown devices."
    basis: illustrative
    enforcedNote: null
    other:
      - src: datasheet:TBD
    bookAlignment: provisional
    claim: Limit switch LS1 (the safety stop for SOL1) was wired between the SOL1 coil and X2 instead of between X1 and the coil. The valve still works, but the SOL1 coil terminals now sit at X1 potential, so a ground fault on the field wire between SOL1 and LS1 would energize SOL1 and bypass LS1 (the arrangement NEC 2026 430.74 prohibits).
    reviewerNotes: Expected readings are generated by the model (see review sheets); device values are typical/illustrative. Check that the symptom matches what the model shows and that the fix restores behavior.
    body:
      engineId: contact-on-x2-side
      title: Limit switch wired on the X2 side of SOL1
      cause: Limit switch LS1 (the safety stop for SOL1) was wired between the SOL1 coil and X2 instead of between X1 and the coil. The valve still works, but the SOL1 coil terminals now sit at X1 potential, so a ground fault on the field wire between SOL1 and LS1 would energize SOL1 and bypass LS1 (the arrangement NEC 2026 430.74 prohibits).
      symptom: "Operator: \"Everything works.\" (Behavior is unchanged: a hazard found by measurement. With LS1 closed, LS1's far terminal reads 0 V to ground instead of 120 V; with LS1 open, SOL1 still has 120 V to ground on both terminals.)"
      fixActions:
        - kind: reland
          target: W:LS1:1
          note: Land LS1 on the X1 side (wire 1).
        - kind: reland
          target: W:LS1:2
          note: Land the LS1 output on wire 11.
        - kind: reland
          target: W:SOL1:C1
          note: Land the SOL1 feed on wire 11.
        - kind: reland
          target: W:SOL1:C2
          note: Land SOL1 directly on X2 (wire 2).
      rootCause: W:LS1:2
      behaviorSame: true
      minMeasurements: 1
      day: 9
