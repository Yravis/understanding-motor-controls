# Device parameter sets for Bucket 1A (generic MCC bucket, no manufacturer).
# NO real datasheet is available to the builder: every number below is TYPICAL / ILLUSTRATIVE.
# The engine reads only params[*].qty. Graded content may never depend on these numbers (lint-enforced).
defaults: &d
  type: deviceSpec
  version: 1
  nec: []
  nema: []
  ieee: []
  excerpts: []
  basis: typical
  enforcedNote: null
  other: [{ src: "datasheet:TBD" }]
  bookAlignment: provisional
  reviewerNotes: "Typical values only; a real datasheet is needed before any value is graded."
items:
  - <<: *d
    id: ch01.u3.s3-18.device.control-supply
    book: { chapter: 1, unit: 3, section: "3.18", page: 37, pageStatus: toc-unverified, figure: null }
    claim: "The bucket control source is a 120 V, 60 Hz supply between X1 and X2 with a small internal impedance, so its terminal voltage sags a little when a coil draws inrush current. X2 is bonded to the enclosure (grounded) in this configuration."
    body:
      tag: SRC
      kind: source
      title: "Control power supply (X1/X2)"
      params:
        volts: { qty: 120, unit: V, tol: "±0" }
        zsR: { qty: 0.35, unit: ohm, tol: "illustrative" }
        zsX: { qty: 0.35, unit: ohm, tol: "illustrative" }
      note: "Internal impedance |Zs| about 0.5 ohm is an illustrative value; real control transformers range from tenths of an ohm to several ohms depending on VA rating. Turning the handle off opens the transformer primary, but the secondary still connects X1 to X2 through a fraction of an ohm. Before an ohms check, pull the control fuse or lift the lead. Pulling F1 only removes the winding; the coils, lamps, and TD3/TD4 electronics still connect the wire to X2 (about 146 Ω). For an insulation test, lift the conductor at both ends so no load or electronics are connected. A 500/1000 V megger could damage the timers and LED drivers."
  - <<: *d
    id: ch01.u3.s3-18.device.supply-fuse
    book: { chapter: 1, unit: 3, section: "3.18", page: 37, pageStatus: toc-unverified, figure: null }
    claim: "The control supply is protected by a supply fuse F1 in the X1 conductor. A fuse opens when enough current flows for long enough; a large fault current opens it quickly, a small overload takes much longer or never opens it."
    body:
      tag: F1
      kind: fuse
      title: "Control supply fuse F1 (X1 side)"
      params:
        rating: { qty: 5, unit: A, tol: "illustrative" }
        r: { qty: 0.02, unit: ohm, tol: "illustrative" }
        minMeltX: { qty: 1.35, unit: ratio, tol: "illustrative" }
        i2tMelt: { qty: 1000, unit: A2s, tol: "illustrative" }
      note: "Simple I-squared-t model. Fuse does not heat below 1.35x rating; 10 A (2x) clears in about 10 s in this model. Real time-current curves differ by fuse class."
  - <<: *d
    id: ch01.u3.s3-18.device.wire-and-bond
    book: { chapter: 1, unit: 3, section: "3.18", page: 37, pageStatus: toc-unverified, figure: null }
    claim: "Control wiring has a small resistance; a loose terminal adds a large resistance or opens the circuit. The enclosure (equipment grounding conductor) is bonded to X2 at the source."
    body:
      tag: WIRE
      kind: wire
      title: "Control wire, loose-terminal and bond parameters"
      params:
        r: { qty: 0.01, unit: ohm, tol: "illustrative" }
