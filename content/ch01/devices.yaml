        groundFaultBoltedR: { qty: 0.05, unit: ohm, tol: "illustrative" }
        groundFaultHighZR: { qty: 100, unit: ohm, tol: "illustrative" }
      note: "Bolted ground-fault path resistance 0.05 ohm vs a 100 ohm high-impedance fault; the second never reaches the fuse's melt current."
  - <<: *d
