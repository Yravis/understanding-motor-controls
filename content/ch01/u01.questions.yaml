  - <<: *d
    id: ch01.u1.s1-2.question.lock-versus-tag
    book: { chapter: 1, unit: 1, section: "1.2", page: 8, pageStatus: toc-unverified, figure: null }
    claim: "A lock physically holds an isolating device off, while a tag is a warning that identifies who applied it and why."
    userSignoff: approved
    userSignoffDate: "2026-11-26"
    other: [{ src: "osha:1910.147(d)" }]
    excerpts: [{ ref: "29 CFR 1910.147(d)", covers: ["osha:1910.147"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147", summary: "Energy control procedure: (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation." }]
    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure."
    body:
      format: mcq
      day: 2
      stem: "What is the difference between the lock and the tag at an isolation point?"
      answers:
        - { text: "The lock holds the device off; the tag warns and names who applied it.", correct: true }
        - { text: "The tag holds the device off; the lock is only a decoration for visibility.", distractorWhy: "A tag cannot physically hold a device off; the lock does that." }
        - { text: "They do the same job, so using one of them on the device is always enough.", distractorWhy: "They serve different purposes; a lock is a barrier and a tag is a warning." }
        - { text: "The lock tells others the reason, and the tag stops the handle moving.", distractorWhy: "That reverses the roles: the tag communicates, the lock restrains." }
