items:
  # ---------------- Day 1 (section 1.1) ----------------
  - <<: *d
    id: ch01.u1.s1-1.question.control-vs-power
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "The control circuit carries the signals that decide when the load is switched, while the power circuit carries the energy that runs the load."
    body:
      format: mcq
      day: 1
      stem: "Which statement best describes the control circuit of a motor installation?"
      answers:
        - { text: "It carries the signals that decide when the load is switched on or off.", correct: true }
        - { text: "It carries the large current that turns the motor shaft under load.", distractorWhy: "That describes the power circuit, not the control circuit." }
        - { text: "It is the section that stays dead because it only holds the wire labels.", distractorWhy: "A control circuit is a working circuit and can be energized; wire labels are just markings." }
        - { text: "It is the metal enclosure and bonding path around the equipment.", distractorWhy: "The enclosure and bonding path are grounding parts, not the control circuit." }
      explanation: "The control circuit decides, and the power circuit does the heavy work. Separating the two ideas makes schematics easier to read, and it reminds you that a control circuit can still be live."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.pilot-device
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "A pushbutton is a pilot device, which sends a command signal, while a relay coil or pilot lamp is a load."
    body:
      format: mcq
      day: 1
      stem: "Which of these is a pilot device rather than a load?"
      answers:
        - { text: "A pushbutton that sends a start signal", correct: true }
        - { text: "A green pilot lamp that glows when current flows", distractorWhy: "A lamp uses the energy and does something with it, so it is a load." }
        - { text: "A solenoid valve operator that moves a plunger", distractorWhy: "A solenoid coil is a load that does work when energized." }
        - { text: "A relay coil that closes contacts when it is energized", distractorWhy: "A coil is a load; its contacts are what the circuit then uses." }
      explanation: "Pilot devices command or report; loads consume energy and act. A lamp, a coil and a solenoid are all loads."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.normal-state
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "The normal state of a contact or device is its de-energized, as-manufactured shelf state."
    body:
      format: mcq
      day: 1
      stem: "What does the word normal mean when describing a normally closed contact?"
      answers:
        - { text: "It is closed when the device has no power and nothing operating it.", correct: true }
        - { text: "It is closed during ordinary running because that is the usual operating mode.", distractorWhy: "Normal refers to the shelf state, not to what happens during typical running." }
        - { text: "It is closed whenever the coil of the nearest relay is energized.", distractorWhy: "A contact closed by an energized coil has changed state; that is not its normal state." }
        - { text: "It is closed only after the operator has pressed the pushbutton once.", distractorWhy: "Operating the device changes its state; normal is the state before that." }
      explanation: "Normal means de-energized and not operated. A normally closed contact is closed in that state and opens when operated."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.foreign-voltage-live
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "An interlock circuit fed from a remote source remains energized when the bucket's own control supply is off, because its source is elsewhere."
    body:
      format: mcq
      day: 1
      stem: "The bucket control supply is off, but the door carries a warning label and orange conductors run to the terminal strip. What should you assume about those conductors?"
      answers:
        - { text: "They may still be live, because a separate remote source feeds them.", correct: true }
        - { text: "They are dead, because turning off the bucket supply turns off everything inside.", distractorWhy: "A circuit fed from another source is not controlled by the bucket's own supply." }
        - { text: "They are safe to touch because orange conductors always mean a de-energized circuit.", distractorWhy: "Orange is only a local convention for foreign circuits and says nothing about being de-energized." }
        - { text: "They are only a spare cable that carries no signal at all.", distractorWhy: "The warning label indicates a real circuit; assuming a spare is an unsafe guess." }
      explanation: "A foreign-voltage circuit stays energized from its own source. The label is a prompt to find that source and isolate it before work."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.meter-function
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "A 120 volt AC control circuit is checked for voltage with the meter set to AC voltage (VAC)."
    body:
      format: mcq
      day: 1
      stem: "You need to check for voltage on a 120 V AC control terminal. Which meter setting is correct?"
      answers:
        - { text: "AC voltage, marked VAC", correct: true }
        - { text: "Continuity, marked with a beeper symbol", distractorWhy: "Continuity mode supplies its own test current and is for de-energized circuits only." }
        - { text: "DC voltage, marked VDC", distractorWhy: "A control circuit on alternating current is read on the AC function." }
        - { text: "Resistance, marked with the ohm symbol", distractorWhy: "Resistance mode must only be used on de-energized, isolated circuits and does not show voltage." }
      explanation: "Match the meter function to what you are measuring. AC control voltage uses the VAC setting; ohms and continuity belong on dead circuits only."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.verify-meter-first
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "A meter is verified on a known live source so that a zero reading on the circuit under test can be trusted."
    body:
      format: mcq
      day: 1
      stem: "Why should you check your meter on a known live source before using it?"
      answers:
        - { text: "So you know a zero reading later means no voltage, not a bad meter.", correct: true }
        - { text: "So the meter battery is charged by the voltage of the known source.", distractorWhy: "Measuring a source does not charge the battery; the purpose is to prove function." }
        - { text: "So the meter automatically selects the correct range for later readings.", distractorWhy: "Range selection has nothing to do with proving the meter works." }
        - { text: "So the circuit under test is guaranteed to be de-energized afterwards.", distractorWhy: "Checking the meter says nothing about the circuit you will test next." }
      explanation: "A faulty meter or wrong setting can read zero on a live circuit. Proving it on a known source first removes that doubt."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.pb1-predict
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "When the start pushbutton PB1 is pressed, CR1 picks up, its normally open contact lights PL1 and its normally closed contact turns PL2 off."
    body:
      format: predict-state
      day: 1
      stem: "In the bucket, PB1 (the START pushbutton) is pressed and the circuit settles. What happens to the CR1 coil and the green and red pilot lamps?"
      scene:
        actions:
          - { do: press, dev: PB1 }
          - { do: advance, arg: 1 }
        expect:
          lit: { PL1: true, PL2: false }
          coil: { CR1.coil: true }
      answers:
        - { text: "CR1 is energized, PL1 (green) is on and PL2 (red) is off.", correct: true }
        - { text: "CR1 is energized, but PL1 is off and PL2 stays on.", distractorWhy: "When CR1 picks up its NO contact closes to light PL1 and its NC contact opens to turn PL2 off." }
        - { text: "CR1 stays off because pressing PB1 only opens a contact.", distractorWhy: "PB1 is normally open; pressing it closes the path to the CR1 coil." }
        - { text: "CR1 is energized and both PL1 and PL2 are on.", distractorWhy: "The NC contact that feeds PL2 opens once CR1 is energized, so PL2 goes dark." }
      explanation: "Pressing PB1 energizes the CR1 coil. The coil moves its contacts: the normally open one closes (PL1 on) and the normally closed one opens (PL2 off)."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.shelf-state-predict
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "With everything idle, CR1 is de-energized, so its normally closed contact lights PL2 and its normally open contact leaves PL1 off."
    body:
      format: predict-state
      day: 1
      stem: "The bucket is powered and nothing has been pressed. Which lamps are lit?"
      scene:
        actions: []
        expect:
          lit: { PL1: false, PL2: true }
          coil: { CR1.coil: false }
      answers:
        - { text: "PL2 (red) is on and PL1 (green) is off, because CR1 is de-energized.", correct: true }
        - { text: "PL1 (green) is on and PL2 (red) is off, because the bucket is powered.", distractorWhy: "PL1 is fed through a normally open contact, which stays open with the coil de-energized." }
        - { text: "Both PL1 and PL2 are off until someone presses a button.", distractorWhy: "PL2 is fed through a normally closed contact, so it is lit in the idle state." }
        - { text: "Both PL1 and PL2 are on because the supply reaches both.", distractorWhy: "A normally open contact blocks PL1 until CR1 energizes." }
      explanation: "Idle means every device is in its normal state. The NC contact passes current to PL2 and the NO contact blocks PL1."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.interlock-lamp-predict
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "The remote interlock lamp PLF is fed from a foreign source and stays lit when the bucket's own control supply is switched off."
    body:
      format: predict-state
      day: 1
      stem: "The bucket control supply is switched off. What happens to the remote interlock lamp PLF, which is fed through the orange conductors?"
      scene:
        actions:
          - { do: supply, arg: false }
        expect:
          lit: { PLF: true, PL2: false, PL1: false }
      answers:
        - { text: "PLF stays lit, because a remote source feeds it.", correct: true }
        - { text: "PLF goes dark, because every lamp depends on the bucket supply.", distractorWhy: "PLF is on a foreign circuit that does not depend on the bucket control supply." }
        - { text: "PLF flickers until the bucket supply is restored.", distractorWhy: "Nothing in the bucket affects its source, so it simply stays on." }
        - { text: "PLF lights only if PB1 is also pressed.", distractorWhy: "PB1 is in the bucket control circuit and has no part in the interlock circuit." }
      explanation: "With the bucket supply off, the bucket lamps go dark, but the interlock circuit still has its own source. That is why identifying every source matters."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-1.question.energy-sources-multi
    book: { chapter: 1, unit: 1, section: "1.1", page: 4, pageStatus: toc-unverified, figure: null }
    claim: "The bucket control supply and the remote source feeding the interlock circuit are energy sources to identify; a pilot lamp and a relay coil are loads."
    body:
      format: multi-select
      day: 1
      stem: "During the bucket tour, which of these are energy sources you must identify? Select all that apply."
      answers:
        - { text: "The control supply between X1 and X2", correct: true }
        - { text: "The remote source behind the orange interlock conductors", correct: true }
        - { text: "The green pilot lamp PL1", distractorWhy: "A lamp is a load that uses energy; it is not a source." }
        - { text: "The CR1 relay coil", distractorWhy: "A coil is a load; it takes energy from a source." }
      explanation: "Sources supply energy. The control supply and the remote interlock source are both sources; lamps and coils are loads."
      dependsOn: []
  # ---------------- Day 2 (section 1.2) ----------------
  - <<: *d
    id: ch01.u1.s1-2.question.employer-procedure
    book: { chapter: 1, unit: 1, section: "1.2", page: 8, pageStatus: toc-unverified, figure: null }
    claim: "A lockout/tagout sequence taught as an example does not replace the employer's own written procedure, which must be followed."
    userSignoff: approved
    userSignoffDate: "2026-11-26"
    other: [{ src: "osha:1910.147(d)" }]
    excerpts: [{ ref: "29 CFR 1910.147(d)", covers: ["osha:1910.147"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147", summary: "Energy control procedure: (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation." }]
    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure."
    body:
      format: mcq
      day: 2
      stem: "The lockout/tagout steps in this course are an example. What should you do when your employer's procedure differs in some details?"
      answers:
        - { text: "Follow your employer's written procedure.", correct: true }
        - { text: "Follow the course steps, since they were learned most recently.", distractorWhy: "The course is an example; the employer's procedure governs on the job." }
        - { text: "Use whichever procedure takes fewer steps on that job.", distractorWhy: "Shortcuts are how steps get skipped; fewer steps is not a valid reason." }
        - { text: "Combine both and skip any step the two do not share.", distractorWhy: "Dropping steps based on a comparison is unsafe and not a sanctioned approach." }
      explanation: "Employers write procedures for their own equipment and hazards. An example teaches the logic; the employer's procedure is the one to follow."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-2.question.loto-order
    book: { chapter: 1, unit: 1, section: "1.2", page: 8, pageStatus: toc-unverified, figure: null }
    claim: "The example lockout/tagout order is prepare and identify all sources, normal shutdown, isolate, lock and tag, relieve stored energy, try the start controls to verify the equipment cannot restart, then verify absence of voltage."
    userSignoff: approved
    userSignoffDate: "2026-11-26"
    other: [{ src: "osha:1910.147(d)" }, { src: "osha:1910.333(b)(2)(iv)(A)" }]
    excerpts: [{ ref: "29 CFR 1910.147(d)", covers: ["osha:1910.147"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147", summary: "Energy control procedure: (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation." }, { ref: "29 CFR 1910.333(b)(2)(iv)(A)", covers: ["osha:1910.333"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.333", summary: "Verification of deenergized condition: a qualified person shall operate the equipment operating controls or otherwise verify that the equipment cannot be restarted. (iv)(B) then requires the test equipment check." }]
    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure."
    body:
      format: order-steps
      day: 2
      stem: "Put this example lockout/tagout sequence in the correct order."
      steps:
        - "Prepare and identify all energy sources"
        - "Shut down by the normal stopping procedure"
        - "Isolate every energy source, including the foreign source"
        - "Apply a lock and tag at each isolation point"
        - "Relieve or restrain stored energy"
        - "Operate the start controls to verify the equipment cannot restart"
        - "Verify absence of voltage with live-dead-live"
      explanation: "You must know every source before isolating, stop the equipment in an orderly way, isolate and lock, and deal with stored energy. Then OSHA 1910.333(b)(2)(iv)(A) has you operate the controls (try START) to verify the equipment cannot restart, and only then prove the circuit dead with the meter."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-2.question.identify-sources-multi
    book: { chapter: 1, unit: 1, section: "1.2", page: 8, pageStatus: toc-unverified, figure: null }
    claim: "Preparation must find the control supply, any remote foreign source and stored energy, not only the source controlled by the local disconnect."
    userSignoff: approved
    userSignoffDate: "2026-11-26"
    other: [{ src: "osha:1910.147(d)" }]
    excerpts: [{ ref: "29 CFR 1910.147(d)", covers: ["osha:1910.147"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147", summary: "Energy control procedure: (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation." }]
    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure."
    body:
      format: multi-select
      day: 2
      stem: "Before isolating a bucket for work, which of these must be identified as energy to deal with? Select all that apply."
      answers:
        - { text: "The control supply feeding X1 and X2", correct: true }
        - { text: "A remote source feeding an interlock circuit", correct: true }
        - { text: "Stored energy such as a charged capacitor or trapped pressure", correct: true }
        - { text: "Only whatever the bucket disconnect handle controls", distractorWhy: "A disconnect does not control a circuit fed from another source." }
        - { text: "The pilot lamp PL1, since it is the only part that glows", distractorWhy: "A lamp is a load, not a source of energy." }
      explanation: "Energy can come from the local supply, from a foreign source, or be stored in equipment. Missing any one of them leaves a hazard."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-2.question.normal-shutdown
    book: { chapter: 1, unit: 1, section: "1.2", page: 8, pageStatus: toc-unverified, figure: null }
    claim: "In the example sequence the equipment is stopped by its normal stopping procedure before the energy sources are isolated."
    userSignoff: approved
    userSignoffDate: "2026-11-26"
    other: [{ src: "osha:1910.147(d)" }]
    excerpts: [{ ref: "29 CFR 1910.147(d)", covers: ["osha:1910.147"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147", summary: "Energy control procedure: (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation." }]
    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure."
    body:
      format: mcq
      day: 2
      stem: "In the example lockout/tagout sequence, why is the equipment stopped normally before the isolating devices are opened?"
      answers:
        - { text: "So the equipment stops in an orderly way, not by an abrupt loss of power.", correct: true }
        - { text: "So the stop button can serve as the lock in place of a padlock.", distractorWhy: "A stop control is not an isolation device and never replaces a lock." }
        - { text: "So the isolating devices are not needed once the stop is pressed.", distractorWhy: "Normal stopping does not isolate any energy source; isolation is still required." }
        - { text: "So the test for absence of voltage can be skipped later on.", distractorWhy: "Verification is always required; stopping does not replace it." }
      explanation: "A normal stop brings the machine to rest in a controlled way. It is not isolation, so every later step is still needed."
      dependsOn: []
  - <<: *d
    id: ch01.u1.s1-2.question.isolate-foreign
    book: { chapter: 1, unit: 1, section: "1.2", page: 8, pageStatus: toc-unverified, figure: null }
    claim: "A foreign-voltage circuit must be isolated at its own remote source, because the bucket disconnect does not de-energize it."
    userSignoff: approved
    userSignoffDate: "2026-11-26"
    other: [{ src: "osha:1910.147(d)" }]
    excerpts: [{ ref: "29 CFR 1910.147(d)", covers: ["osha:1910.147"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147", summary: "Energy control procedure: (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation." }]
    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure."
    body:
      format: mcq
      day: 2
      stem: "Where is the interlock circuit fed from a remote panel isolated in the example sequence?"
      answers:
        - { text: "At its own source, in the remote panel, with its own lock and tag.", correct: true }
        - { text: "At the bucket disconnect, since that handle opens every circuit inside.", distractorWhy: "The bucket disconnect only opens the circuits it controls; the remote source is unaffected." }
        - { text: "Nowhere, because a low-energy interlock circuit cannot hurt anyone.", distractorWhy: "Low energy does not mean harmless; every source must be isolated or proven dead." }
        - { text: "By pulling the warning label off the door and keeping it nearby.", distractorWhy: "A label is information, not an isolation device." }
