    body:
      format: mcq
      day: 2
      stem: "Which set of checks correctly covers the test for absence of voltage on the bucket?"
      answers:
        - { text: "X1-X2, X1-ground, X2-ground, plus foreign circuit terminals", correct: true }
        - { text: "X1-X2 only, since that pair is the control supply itself", distractorWhy: "A single pair can read zero while another combination is still live, for example a fault to ground." }
        - { text: "X1-ground only, since ground is the safest reference point", distractorWhy: "One combination does not show the other conductor or the foreign circuit is dead." }
        - { text: "Only the terminals that a technician happened to label", distractorWhy: "Labels can be missing or wrong; every combination must be tested." }
      explanation: "Testing every combination, including foreign-circuit terminals, catches live conductors that a single reading would miss."
