  - <<: *d
    id: ch01.u1.s1-2.question.recheck-meter
    book: { chapter: 1, unit: 1, section: "1.2", page: 8, pageStatus: toc-unverified, figure: null }
    claim: "In live-dead-live, the meter is checked on a known source again after the absence-of-voltage tests to show it did not fail during the tests."
    userSignoff: approved
    userSignoffDate: "2026-11-26"
    other: [{ src: "osha:1910.147(d)" }, { src: "nfpa70e-2024:test-for-absence" }]
    excerpts: [{ ref: "29 CFR 1910.147(d)", covers: ["osha:1910.147"], url: "https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147", summary: "Energy control procedure: (d)(1) preparation, (d)(2) shutdown, (d)(3) isolation, (d)(4) lockout/tagout device application, (d)(5) stored energy, (d)(6) verification of isolation." }]
    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure. Claim also rests on NFPA 70E 2024 (test for absence / live-dead-live, 120.6): blocked until that excerpt is attached."
    body:
      format: mcq
      day: 2
      stem: "In live-dead-live, why is the meter checked on the known live source again after the zero readings?"
      answers:
        - { text: "To show the meter still works, so the zero readings can be trusted.", correct: true }
        - { text: "To drain any leftover charge out of the circuit that was tested.", distractorWhy: "A meter check does not discharge anything; stored energy is handled earlier." }
        - { text: "To re-energize the circuit so the lock can be removed safely.", distractorWhy: "Re-energizing is the opposite of the goal; the final check only proves the meter." }
        - { text: "To reset the meter so it displays zero for the next user.", distractorWhy: "The check is about proof of function, not about resetting a display." }
      explanation: "A meter can fail during the tests. The second live check shows it still read correctly, so the dead readings mean the circuit really was dead."
      dependsOn: []
