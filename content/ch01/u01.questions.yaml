    reviewerNotes: "LOTO item. User approved the standard OSHA 1910.147(d) + NFPA 70E 2024 approach on 2026-11-26 (PSC follows standard practice). Example procedure; always follow your employer's procedure. Claim also rests on NFPA 70E 2024 (test for absence / live-dead-live, 120.6): blocked until that excerpt is attached."
    body:
      format: mcq
      day: 2
      stem: "When is it appropriate to use the ohmmeter or continuity function on a control circuit?"
      answers:
        - { text: "Only after the circuit is isolated and proven de-energized", correct: true }
        - { text: "Any time, because the meter protects itself from live circuits", distractorWhy: "Resistance mode is not designed for live circuits and can give false readings or damage the meter." }
        - { text: "To decide whether the circuit is live before you test it", distractorWhy: "Use the voltage function to look for voltage, after proving the meter on a known source." }
        - { text: "Whenever the pilot lamp is dark, since a dark lamp means dead", distractorWhy: "A dark lamp does not prove the circuit is dead; a blown lamp or open contact looks the same." }
      explanation: "Ohms and continuity supply their own test current and assume no external voltage. Isolate and verify first, then switch to those functions."
      dependsOn: []
